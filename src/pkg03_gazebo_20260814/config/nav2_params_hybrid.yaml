amcl:
  ros__parameters:
    use_sim_time: True
    # alpha1~alpha4: 里程计运动模型(robot_model_type = DifferentialMotionModel)的噪声系数,
    #   它们不是"固定噪声",而是"与本次运动量成正比的噪声标准差":
    #     trans_hat_stddev = sqrt(alpha3 * d_trans^2 + alpha1 * d_rot^2)
    #     rot_hat_stddev   = sqrt(alpha4 * d_rot^2   + alpha2 * d_trans^2)
    #   即 alpha3/alpha4 控制"平移带来的平移/旋转误差",alpha1/alpha2 控制
    #   "旋转带来的平移/旋转误差"。粒子云靠这一项散开,散开幅度必须能覆盖
    #   真实里程计误差,否则粒子云把真值排除在外,激光也没法把它拉回来。
    #
    #   本值 0.2(全部):这是按实车(轮胎打滑、地面不平、轮径磨损)配的量级,
    #     在仿真下同样成立,原因见下面的实测失败记录。
    #     本项目仿真里 /odom 已切为 ENCODER 积分(odometry_source:0),
    #     虽无打滑、无地面扰动,但轮径/轮距参数仍带来系统性比例误差:
    #     实测 3.07 m 处位置误差 0.343 m、5.10 m 处 1.252 m,
    #     折合每 0.4 m 行进约 0.098 m 偏差;且该误差随距离线性累积,
    #     180° 转向可积到约 40° 航向偏差。
    #     粒子云散开幅度必须能覆盖这一量级,否则真值被排除在粒子覆盖外。
    #
    #   [2026-11-23 实测失败,已回滚] 上一轮曾按"每步标准差与实测偏差同量级"
    #   的推理把本值降到 0.05,结果灾难性跟丢(C 组):
    #     10 个航点 8 成功 2 失败,总耗时 462.0 s(基线 207.7 s),
    #     末点位置误差 6.892 m、yaw 误差 +107.49°,全程最大误差 9.030 m;
    #     79~88 s 原地转 180° 时 yaw 滞后由 28° 涨到 41°(基线同期仅 16°),
    #     118.6 s 在 0.5 s 内位姿瞬移 3.6 m、yaw 跳 258°,
    #     bt_log 出现 Spin 4 次、BackUp 3 次、规划连续失败。
    #   机理:alpha=0.05 在 update_min_a=0.2 rad 时给出的航向散开仅
    #     sqrt(0.05*0.2^2)=0.045 rad ≈ 2.6°,而实测 180° 转向的航向漂移约 40°,
    #     粒子云比真实漂移窄十几倍,真值不在粒子覆盖范围内,激光再准也拉不回来;
    #     叠加 resample_interval=1(每次更新都重采样),多样性逐轮减半,
    #     几十次更新后 2000 个粒子全挤在同一错误假设上 = 粒子耗尽
    #     (particle depletion),recovery_alpha_* 注入的少量随机粒子无法翻盘。
    #   被推翻的推理:原先拿"每 0.4 m 行进偏差 0.098 m"去对标 alpha,是错的——
    #     alpha 建模的是每步独立随机噪声(随步数开方增长、可互相抵消),
    #     而 ENCODER 误差是系统性比例误差(轮距/轮径比例偏差、打滑,
    #     随距离线性累积、不可抵消)。正确比较对象是"一个更新间隔
    #     (0.25 m 平移 / 0.2 rad 旋转)内累积多少偏差";若航向存在 25% 比例
    #     误差,转 180° 就积 45°,与实测 40° 吻合。
    #   结论:仿真里 alpha 不能压低,粒子云散开必须覆盖系统性里程计偏差。
    #
    #   本值 0.2:按实车(轮胎打滑、地面不平、轮径磨损)配的量级,
    #     已被 A 组(基线)与 B 组(z_hit 0.9 / z_rand 0.1)两轮实测证明可用
    #     (均 10/10 成功、末点误差 0.033 m、无恢复行为)。
    #     不回退到 0.1:C 组是灾难性崩塌而非边际劣化,0.1 落在 0.05 与 0.2
    #     之间且无任何实测证据,不值得再冒一次跟丢风险。
    #
    #   单变量原则:本轮(z_hit 0.9 / z_rand 0.1)与回滚(alpha 0.2)合并为一组,
    #   用于验证 B 组结论的可复现性(n=1 -> n=2),其余参数
    #   (sigma_hit 0.05 / max_beams 180 / laser_max_range 8.0 /
    #   update_min_d 0.25 / update_min_a 0.2)全部保持 B 组值不变。
    #   风险与回退:若粒子云频繁炸开、位姿抖动,说明 alpha 偏大,
    #   届时才考虑下调到 0.1(而非直接 0.05)。
    #
    #   [2026-11-24 轮距修正后重评,F 组] 上面"C 组证明 alpha 不能压低"的结论
    #   建立在 wheel_separation 配错(0.24 vs 实际 0.36)的前提上,该前提已消除:
    #   探针实测修正后 odom/真值 = 1.055、真值/指令 = 0.955,残余 5.5% 为真实轮胎滑移。
    #   按一个更新间隔重算真实偏差与 alpha 0.05 的粒子散开幅度:
    #     航向: d_rot = update_min_a 0.2 rad,真实偏差 0.2 * 5.5% = 0.011 rad = 0.63°
    #           alpha 0.05 给出 sqrt(0.05 * 0.04) = 0.045 rad = 2.56° -> 覆盖 4 倍,充足
    #     平移: d_trans = update_min_d 0.25 m,真实偏差 0.25 * 5.5% = 0.014 m
    #           alpha 0.05 给出 sqrt(0.05 * 0.0625) = 0.056 m -> 覆盖 4 倍,充足
    #   对照 C 组:同一 alpha 0.05 只有 2.56° 要覆盖 40° 真实偏差(差约 15 倍)-> 粒子耗尽。
    #   即 C 组失败的真因是航向 1.5 倍放大,而非 alpha 过小。
    #   本组设计:与 C 组构成单变量对照,唯一差异是 sep 0.24 vs 0.36,
    #     若本组 10/10 成功而 C 组 8/10 跟丢,即可定案上述结论。
    #     与 E 组(sep 0.36 + alpha 0.2)构成另一对照,唯一差异是 alpha 0.2 vs 0.05。
    #   风险与回退:若仍出现跟丢、位姿瞬移、bt_log 出现 Spin/BackUp,
    #     说明修正后 alpha 0.05 依旧偏小,回退到 0.1,并保留本段注释作为负结果记录。
    #
    #   [2026-11-24 F 组实测,已回滚至 0.2] 上述重评假设成立,F 组(sep 0.36 + alpha 0.05)
    #   六条判据全过:C 组 8/10 / 462.0 s / 末点 6.892 m / Spin4+BackUp3
    #     -> F 组 10/10 / 198.4 s / 末点 0.003 m / 无 Spin 无 BackUp,run.log 无 WARN/ERROR。
    #   即 C 组跟丢真因确为 wheel_separation 航向 1.5 倍放大,而非 alpha 过小,该结论已定案。
    #   但 alpha 0.05 相对 0.2 无任何可测收益:
    #     覆盖倍数 alpha 0.05 = 2.56/0.63 = 4 倍,alpha 0.2 = 5.13/0.63 = 8 倍,
    #     两者都落在"能覆盖、不耗尽"的充分区间,不存在量变到质变的临界点。
    #     E 组(alpha 0.2)与 F 组(alpha 0.05)对照:成功 10/10 对 10/10、
    #     耗时 200.4 对 198.4 s、末点位置 0.033 对 0.003 m、
    #     末点真值超调 7.7 度对 8.5 度(均落在 yaw_goal_tolerance 8.6 度内),
    #     差异全部落在运行间波动与末点收敛巧合范围内,不构成改善。
    #   按 5.5% 真实滑移反推理论最优 alpha 约 0.003(sqrt(alpha) = 滑移率),
    #     故 0.05 仍偏保守、0.2 更保守,继续下压只会牺牲抗异常余量、重演 C 组风险。
    #   结论:回滚 0.2(与 A/B/D/E 组同源,文档基线一致),不再沿 alpha 方向探索。
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    # alpha5: 仅 OmniMotionModel(全向轮/麦克纳姆轮)使用,用于侧向平移噪声。
    #   本项目 robot_model_type 为 DifferentialMotionModel(差速),
    #   该值不参与任何计算,保留仅为将来换模型时可用,改动它不影响本组结果。
    alpha5: 0.2
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    # laser_max_range: 8.0 —— 必须与 lidar.urdf.xacro 的 <range><max>8.0</max> 逐字一致。
    #   该值不是"AMCL 允许用的最大距离",而是"无回波判定线":
    #     range <  此值 → 走 likelihood_field,视为真实命中
    #     range >= 此值 → 走 z_max + z_rand,视为打空/超量程
    #   原值 100.0 时,仿真里所有 0~8 m 读数都小于它,于是打空射线(读数恒为
    #   range_max=8.0)被当成"8 m 处的有效命中"。而 8 m 远超
    #   laser_likelihood_max_dist 2.0 m,该处似然场为 0,命中项算出来趋近 0
    #   —— 无回波射线反而变成对粒子的强惩罚,与物理含义完全相反。
    #   另:z_rand 项的均匀分布按量程归一化(见 nav2_amcl likelihood_field_model),
    #   100 会把随机项压成 8 的 1/12.5,等于把 z_hit:z_rand 的 0.5:0.5 悄悄改成
    #   近乎纯 z_hit。改为 8.0 后以上两项同时纠正。
    #   后续若改雷达量程,此处必须同步;也可写 -1.0 表示"取消息自带 range_max",
    #   自动跟随 URDF,但会让配置失去自解释性,故此处取显式值。
    laser_max_range: 8.0
    # -1.0 = 用消息自带的 range_min,自动等于 lidar 的 0.12 m,此处无需显式写。
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    # max_beams: 180 —— 每帧参与打分的激光束数量上限。
    #   抽取方式(nav2_amcl likelihood_field_model): step=(range_count-1)/(max_beams-1),
    #   然后每隔 step 束取一束,故 max_beams 只有取"能整除"的值才不浪费。
    #   本雷达 samples=720(0.5°/线,见 lidar.urdf.xacro L81),对应关系:
    #     max_beams= 60 → step=12 → 实取 60 束,角间隔 6.0°  (原值,Nav2 默认)
    #     max_beams=120 → step= 6 → 实取120 束,角间隔 3.0°
    #     max_beams=180 → step= 4 → 实取180 束,角间隔 2.0°  (本值)
    #     max_beams=240 → step= 3 → 实取240 束,角间隔 1.5°
    #   取 100 这类非整除值会得到 step=7、实取 103 束、角间隔 3.5°,与预期不符。
    #
    #   为什么改:60 束时相邻两束在 3 m 处横向间隔 3*tan(6°)=0.315 m,已远超
    #   sigma_hit 0.05 m(1 个栅格)。likelihood_field 的得分是"端点与最近障碍的
    #   距离",端点采样过稀意味着部分墙体/柱角可能整帧落在两束之间被完全跳过,
    #   打分对位姿的响应变得锯齿化;角向约束不足直接影响 yaw 收敛,与本项目
    #   实测"末点 yaw 系统性多估 9~11°""旋转时 yaw 分辨率不足"一致。
    #   本值 180 束时角间隔 2.0°,3 m 处 0.105 m,约为 sigma_hit 的 2 倍,
    #   与 sigma_hit 同一量级,角向约束已足够密。
    #   若本机 CPU 吃紧导致 /amcl_pose 频率明显下降,可回退 120
    #   (角间隔 3.0°,3 m 处 0.157 m,约 sigma_hit 的 3 倍)。
    #
    #   代价:打分耗时随束数线性增长(粒子数×束数×1 次距离场查表)。
    #   2000 粒子×180 束=36 万次/更新;因 update_min_d=0.25 限制更新频率,
    #   移动时约 1 次/秒,量级 36 万/秒,可忽略。
    #   注意:束数增加不会自动提升粒子数不足带来的分辨率瓶颈,故 max_particles
    #   本轮不动,保持单一变量。
    max_beams: 180
    max_particles: 2000 # 最大粒子数-particles:粒子
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    # 恢复机制-随机粒子注入(random particle injection):
    #   机制:w_slow / w_fast 是"观测质量"的慢/快指数滑动平均,注入概率 = 1 - w_fast/w_slow。
    #     w_fast 贴合单帧(alpha 大),w_slow 看长期(alpha 小);
    #     当近期观测突然变差(w_fast < w_slow)时判定为"可能跟丢",按概率把部分粒子
    #     重置到全局随机位置,给滤波器一次自救机会。
    #   两值同时为 0.0 = 完全关闭:nav2_amcl 的 pf_update_sensor 里
    #     "if (w_slow == 0) w_slow = w_avg; else w_slow += alpha*(...)",alpha 为 0 时
    #     只在第一次更新把 w_slow / w_fast 初始化成同一个 w_avg,之后两者恒等,
    #     注入概率 = 1 - 1 = 0,永不注入。不会出现除零。
    #
    #   [2026-11-24 G 组] 本值 0.0 / 0.0,关闭随机粒子注入。
    #   依据:仿真雷达纯理想(无 <noise> 块)、地图静态、无动态障碍,观测质量恒定,
    #     w_fast 与 w_slow 在理论上不存在"突然变差"的物理来源,
    #     注入机制只会引入无意义的随机扰动,反而打断已收敛的粒子云。
    #     本项目参考基线 nav2_params.yaml L26-L27 亦为 0.0 / 0.0。
    #   前提条件(必须同时满足,否则不要关):初始位姿由 partol_node 显式发布(0,0,0),
    #     且 alpha 0.2 给出的粒子散开(航向 5.13 度)覆盖真实偏差(0.63 度)约 8 倍,
    #     不存在粒子耗尽的物理基础。E 组(sep 0.36 + alpha 0.2)已实测 10/10、无 Spin/BackUp。
    #   风险与回退:关闭后粒子云一旦收敛到错误位置便永久无法自救(这正是
    #     "初始位姿给错 90 度 / 角落旋转被粒子云包围"这类故障的根因之一)。
    #     若本轮出现跟丢、位姿瞬移、bt_log 出现 Spin/BackUp,
    #     立即回退 0.1 / 0.001(与 A~F 组同源),并保留本段注释作为负结果记录。
    #   单变量原则:本轮唯一变量即这两个值,alpha1~4 已回滚至 0.2、
    #     sep 0.36 / z_hit 0.9 / z_rand 0.1 / sigma_hit 0.05 / max_beams 180 /
    #     laser_max_range 8.0 / update_min_d 0.25 / update_min_a 0.2 全部保持 E 组值。
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    # sigma_hit: 0.05
    #   likelihood_field 模型下这个值不是"雷达测距噪声",而是"观测端点与地图
    #   最近障碍的期望距离偏差",同时包含两类误差:地图栅格离散化(0.05 m)、
    #   粒子位姿离散化。因此即使雷达零噪声,也不能设为 0。
    #   本仿真雷达 lidar.urdf.xacro 的 <sensor> 内无 <noise> 块(纯理想传感器),
    #   故取 1 个栅格 = 0.05 m 与之匹配。原值 0.2 相当于 4 个栅格,偏宽 4 倍。
    #   风险:过小时似然面过尖,粒子稍偏即打分趋零,表现为收敛快但易陷局部最优。
    #   若实测出现定位抖动/跟丢/原地打转,回退 0.1(2 个栅格)再测。
    sigma_hit: 0.05
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    # z_hit / z_rand: likelihood_field 模型下单帧观测得分为
    #     p = z_hit * exp(-d^2 / 2*sigma_hit^2) + z_rand * (1 / laser_max_range)
    #   其中 z_rand 项与粒子位姿无关,是所有粒子共享的常数底噪,唯一作用是抬高
    #   "差粒子"的基础分、压缩好粒子与差粒子的相对差距,即把似然面压平。
    #   原值 0.5 : 0.5(等权):z_rand 项 = 0.5/8 = 0.0625,与命中项同量级,
    #     位姿区分度被削掉约一半,粒子权重差异变小,表现为收敛变慢、旋转瞬态
    #     误差偏大(基线组更新时刻 yaw 误差极值 -17.19 度)。
    #   本值 0.9 : 0.1:z_rand 项 = 0.1/8 = 0.0125,命中项相对区分度放大约 5 倍。
    #   单变量原则:本轮只动这两个值,sigma_hit / max_beams / laser_max_range /
    #   update_min_d / update_min_a 全部保持基线值不变。
    #   风险与回退:本项目 /odom 已切为 ENCODER 积分(实测 5.1 m 处漂移 1.25 m),
    #   似然面过尖时粒子云易被锁死在错误位置。若实测出现恢复行为(随机粒子注入)、
    #   原地打转,或位置误差最大值明显上升,回退到 0.7 : 0.3 再测,不要直接回 0.5。
    z_hit: 0.9
    z_max: 0.05
    z_rand: 0.1
    # z_max / z_short / lambda_short: 这三个是 beam 模型(laser_model_type 为
    #   "beam" 或 "likelihood_field_prob")专用参数,当前模型为 likelihood_field,
    #   它们不参与任何计算。保留仅为将来切换模型时可用,改动它们不会影响本组结果。
    z_short: 0.05
    scan_topic: scan

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
